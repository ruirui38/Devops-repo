name: Trivy

on:
  pull_request:
    branches:
      - main

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Dockerイメージをビルド
        run: docker build -t todo-api:${{ github.sha }} .

      - name: Trivyでイメージをスキャン
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: todo-api:${{ github.sha }}
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
