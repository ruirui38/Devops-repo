name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_MODEL: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: "true"
          allowed_bots: "github-actions[bot]"
          claude_args: '--allowedTools "Bash(git diff:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          prompt: |
            このPull Request（#${{ github.event.pull_request.number }}）を日本語でレビューしてください。

            .claude/agents/code-reviewer.md の code-reviewer サブエージェントを
            Task ツール経由で起動してレビューを実施してください。

            レビューが終わったら、指摘内容を「## 総評」「## 要修正」「## 提案」の
            3セクションに整理してください。大きな問題がない場合は「## 総評」だけを短く返してください。

            整理した内容は、必ずBashツールで以下のコマンドを実行してPRに投稿してください。
            レビュー内容をチャットで返信するだけでは投稿されないので、このコマンド実行を省略しないでください。

              gh pr comment ${{ github.event.pull_request.number }} --body "<レビュー本文>"

            本文が長い/改行を含む場合は、一時ファイルに書き出してから
            `gh pr comment ${{ github.event.pull_request.number }} --body-file <ファイルパス>` を使ってください。